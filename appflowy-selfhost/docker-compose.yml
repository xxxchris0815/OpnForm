# AppFlowy Cloud – Self-Hosting hinter einem externen Caddy
# Stand der Images: 2026-09-09 (aktuellste Tags auf Docker Hub)
#
# Caddy übernimmt TLS. Internes nginx routet die AppFlowy-Pfade
# (/api, /ws, /gotrue, /minio-api, /console, Web-UI).
#
# Start:
#   cp .env.example .env
#   # Werte in .env anpassen
#   docker compose up -d

name: appflowy

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: appflowy-nginx
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      appflowy_cloud:
        condition: service_healthy
      gotrue:
        condition: service_healthy
      appflowy_web:
        condition: service_started
    ports:
      # Nur lokal, Caddy auf demselben Host proxied hierher.
      # Anderer Host: Bindung auf 0.0.0.0 in .env setzen oder
      # docker-compose.proxy.yml für ein gemeinsames Docker-Netz nutzen.
      - "${APPFLOWY_BIND_ADDRESS:-127.0.0.1}:${APPFLOWY_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: pgvector/pgvector:pg16
    container_name: appflowy-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGPORT: ${POSTGRES_PORT:-5432}
    command: ["postgres", "-c", "port=${POSTGRES_PORT:-5432}"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres} -p ${POSTGRES_PORT:-5432}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: appflowy-redis
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - internal

  minio:
    image: minio/minio:latest
    container_name: appflowy-minio
    restart: unless-stopped
    logging: *default-logging
    environment:
      MINIO_BROWSER_REDIRECT_URL: ${APPFLOWY_BASE_URL}/minio
      MINIO_ROOT_USER: ${APPFLOWY_S3_ACCESS_KEY:?set APPFLOWY_S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${APPFLOWY_S3_SECRET_KEY:?set APPFLOWY_S3_SECRET_KEY in .env}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 20s
    volumes:
      - minio_data:/data
    networks:
      - internal

  gotrue:
    image: appflowyinc/gotrue:${GOTRUE_VERSION:-0.18.6}
    container_name: appflowy-gotrue
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://127.0.0.1:9999/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s
    environment:
      GOTRUE_ADMIN_EMAIL: ${GOTRUE_ADMIN_EMAIL}
      GOTRUE_ADMIN_PASSWORD: ${GOTRUE_ADMIN_PASSWORD}
      GOTRUE_DISABLE_SIGNUP: ${GOTRUE_DISABLE_SIGNUP:-false}
      GOTRUE_SITE_URL: appflowy-flutter://
      GOTRUE_URI_ALLOW_LIST: "**"
      GOTRUE_JWT_SECRET: ${GOTRUE_JWT_SECRET:?set GOTRUE_JWT_SECRET in .env}
      GOTRUE_JWT_EXP: ${GOTRUE_JWT_EXP:-604800}
      GOTRUE_JWT_ADMIN_GROUP_NAME: supabase_admin
      GOTRUE_DB_DRIVER: postgres
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      DATABASE_URL: ${GOTRUE_DATABASE_URL}
      PORT: 9999
      GOTRUE_SMTP_HOST: ${GOTRUE_SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${GOTRUE_SMTP_PORT:-465}
      GOTRUE_SMTP_USER: ${GOTRUE_SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${GOTRUE_SMTP_PASS:-}
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /gotrue/verify
      GOTRUE_MAILER_URLPATHS_INVITE: /gotrue/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /gotrue/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /gotrue/verify
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: ${GOTRUE_MAILER_TEMPLATES_MAGIC_LINK:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${GOTRUE_SMTP_ADMIN_EMAIL:-}
      GOTRUE_SMTP_MAX_FREQUENCY: ${GOTRUE_SMTP_MAX_FREQUENCY:-1ns}
      GOTRUE_RATE_LIMIT_EMAIL_SENT: ${GOTRUE_RATE_LIMIT_EMAIL_SENT:-100}
      GOTRUE_MAILER_AUTOCONFIRM: ${GOTRUE_MAILER_AUTOCONFIRM:-true}
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOTRUE_EXTERNAL_GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOTRUE_EXTERNAL_GOOGLE_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI:-}
      GOTRUE_EXTERNAL_GITHUB_ENABLED: ${GOTRUE_EXTERNAL_GITHUB_ENABLED:-false}
      GOTRUE_EXTERNAL_GITHUB_CLIENT_ID: ${GOTRUE_EXTERNAL_GITHUB_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GITHUB_SECRET: ${GOTRUE_EXTERNAL_GITHUB_SECRET:-}
      GOTRUE_EXTERNAL_GITHUB_REDIRECT_URI: ${GOTRUE_EXTERNAL_GITHUB_REDIRECT_URI:-}
      GOTRUE_EXTERNAL_DISCORD_ENABLED: ${GOTRUE_EXTERNAL_DISCORD_ENABLED:-false}
      GOTRUE_EXTERNAL_DISCORD_CLIENT_ID: ${GOTRUE_EXTERNAL_DISCORD_CLIENT_ID:-}
      GOTRUE_EXTERNAL_DISCORD_SECRET: ${GOTRUE_EXTERNAL_DISCORD_SECRET:-}
      GOTRUE_EXTERNAL_DISCORD_REDIRECT_URI: ${GOTRUE_EXTERNAL_DISCORD_REDIRECT_URI:-}
      GOTRUE_SAML_ENABLED: ${GOTRUE_SAML_ENABLED:-false}
      GOTRUE_SAML_PRIVATE_KEY: ${GOTRUE_SAML_PRIVATE_KEY:-}
    networks:
      - internal

  appflowy_cloud:
    image: appflowyinc/appflowy_cloud:${APPFLOWY_CLOUD_VERSION:-0.18.6}
    container_name: appflowy-cloud
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      gotrue:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://127.0.0.1:8000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      APPFLOWY_ENVIRONMENT: production
      APPFLOWY_DATABASE_URL: ${APPFLOWY_DATABASE_URL}
      APPFLOWY_REDIS_URI: ${APPFLOWY_REDIS_URI}
      APPFLOWY_GOTRUE_JWT_SECRET: ${GOTRUE_JWT_SECRET}
      APPFLOWY_GOTRUE_BASE_URL: ${APPFLOWY_GOTRUE_BASE_URL}
      APPFLOWY_S3_CREATE_BUCKET: ${APPFLOWY_S3_CREATE_BUCKET:-true}
      APPFLOWY_S3_USE_MINIO: ${APPFLOWY_S3_USE_MINIO:-true}
      APPFLOWY_S3_MINIO_URL: ${APPFLOWY_S3_MINIO_URL}
      APPFLOWY_S3_ACCESS_KEY: ${APPFLOWY_S3_ACCESS_KEY}
      APPFLOWY_S3_SECRET_KEY: ${APPFLOWY_S3_SECRET_KEY}
      APPFLOWY_S3_BUCKET: ${APPFLOWY_S3_BUCKET:-appflowy}
      APPFLOWY_S3_REGION: ${APPFLOWY_S3_REGION:-us-east-1}
      APPFLOWY_S3_PRESIGNED_URL_ENDPOINT: ${APPFLOWY_S3_PRESIGNED_URL_ENDPOINT}
      APPFLOWY_MAILER_SMTP_HOST: ${APPFLOWY_MAILER_SMTP_HOST:-}
      APPFLOWY_MAILER_SMTP_PORT: ${APPFLOWY_MAILER_SMTP_PORT:-465}
      APPFLOWY_MAILER_SMTP_USERNAME: ${APPFLOWY_MAILER_SMTP_USERNAME:-}
      APPFLOWY_MAILER_SMTP_EMAIL: ${APPFLOWY_MAILER_SMTP_EMAIL:-}
      APPFLOWY_MAILER_SMTP_PASSWORD: ${APPFLOWY_MAILER_SMTP_PASSWORD:-}
      APPFLOWY_MAILER_SMTP_TLS_KIND: ${APPFLOWY_MAILER_SMTP_TLS_KIND:-wrapper}
      APPFLOWY_ACCESS_CONTROL: ${APPFLOWY_ACCESS_CONTROL:-true}
      APPFLOWY_DATABASE_MAX_CONNECTIONS: ${APPFLOWY_DATABASE_MAX_CONNECTIONS:-40}
      AI_SERVER_HOST: ${AI_SERVER_HOST:-ai}
      AI_SERVER_PORT: ${AI_SERVER_PORT:-5001}
      AI_OPENAI_API_KEY: ${AI_OPENAI_API_KEY:-}
      APPFLOWY_WEB_URL: ${APPFLOWY_WEB_URL}
      APPFLOWY_BASE_URL: ${APPFLOWY_BASE_URL}
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY:-}
      ASSEMBLYAI_API_BASE: ${ASSEMBLYAI_API_BASE:-https://api.assemblyai.com/v2}
      ASSEMBLYAI_STREAMING_API_BASE: ${ASSEMBLYAI_STREAMING_API_BASE:-https://streaming.assemblyai.com/v3}
      APPFLOWY_SEARCH_SERVICE_URL: ${APPFLOWY_SEARCH_SERVICE_URL:-http://appflowy_search:4002}
      APPFLOWY_SEARCH_REQUEST_TIMEOUT_SECS: ${APPFLOWY_SEARCH_REQUEST_TIMEOUT_SECS:-10}
      AI_ENABLED: ${AI_ENABLED:-true}
      SIGNUP_WHITELIST_ENABLED: ${SIGNUP_WHITELIST_ENABLED:-false}
      GUEST_INVITES_REQUIRE_ADMIN_APPROVAL: ${GUEST_INVITES_REQUIRE_ADMIN_APPROVAL:-false}
    networks:
      - internal

  admin_frontend:
    image: appflowyinc/admin_frontend:${APPFLOWY_ADMIN_FRONTEND_VERSION:-0.17.13}
    container_name: appflowy-admin
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      gotrue:
        condition: service_healthy
      appflowy_cloud:
        condition: service_healthy
    environment:
      APPFLOWY_GOTRUE_BASE_URL: ${APPFLOWY_GOTRUE_BASE_URL:-http://gotrue:9999}
      APPFLOWY_BASE_URL: ${APPFLOWY_BASE_URL:-http://appflowy_cloud:8000}
    networks:
      - internal

  ai:
    image: appflowyinc/appflowy_ai:${APPFLOWY_AI_VERSION:-0.17.7}
    container_name: appflowy-ai
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      appflowy_cloud:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      AI_SERVER_PORT: ${AI_SERVER_PORT:-5001}
      OPENAI_API_KEY: ${AI_OPENAI_API_KEY:-}
      DEFAULT_AI_MODEL: ${DEFAULT_AI_MODEL:-gpt-4.1-mini}
      DEFAULT_AI_COMPLETION_MODEL: ${DEFAULT_AI_COMPLETION_MODEL:-gpt-4.1-mini}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-}
      APPFLOWY_S3_ACCESS_KEY: ${APPFLOWY_S3_ACCESS_KEY}
      APPFLOWY_S3_SECRET_KEY: ${APPFLOWY_S3_SECRET_KEY}
      APPFLOWY_S3_BUCKET: ${APPFLOWY_S3_BUCKET:-appflowy}
      APPFLOWY_S3_REGION: ${APPFLOWY_S3_REGION:-us-east-1}
      AI_DATABASE_URL: ${APPFLOWY_DATABASE_URL}
      AI_REDIS_URL: ${APPFLOWY_REDIS_URI}
      AI_USE_MINIO: ${APPFLOWY_S3_USE_MINIO:-true}
      AI_MINIO_URL: ${APPFLOWY_S3_MINIO_URL}
      AI_APPFLOWY_HOST: ${APPFLOWY_BASE_URL}
      APPFLOWY_GOTRUE_JWT_SECRET: ${GOTRUE_JWT_SECRET}
    networks:
      - internal

  appflowy_worker:
    image: appflowyinc/appflowy_worker:${APPFLOWY_WORKER_VERSION:-0.18.6}
    container_name: appflowy-worker
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      appflowy_cloud:
        condition: service_healthy
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      APPFLOWY_ENVIRONMENT: production
      APPFLOWY_WORKER_REDIS_URL: ${APPFLOWY_WORKER_REDIS_URL:-redis://redis:6379}
      APPFLOWY_WORKER_ENVIRONMENT: production
      APPFLOWY_WORKER_DATABASE_URL: ${APPFLOWY_WORKER_DATABASE_URL}
      APPFLOWY_WORKER_DATABASE_NAME: ${APPFLOWY_WORKER_DATABASE_NAME}
      APPFLOWY_WORKER_IMPORT_TICK_INTERVAL: 30
      APPFLOWY_S3_USE_MINIO: ${APPFLOWY_S3_USE_MINIO:-true}
      APPFLOWY_S3_MINIO_URL: ${APPFLOWY_S3_MINIO_URL}
      APPFLOWY_S3_ACCESS_KEY: ${APPFLOWY_S3_ACCESS_KEY}
      APPFLOWY_S3_SECRET_KEY: ${APPFLOWY_S3_SECRET_KEY}
      APPFLOWY_S3_BUCKET: ${APPFLOWY_S3_BUCKET:-appflowy}
      APPFLOWY_S3_REGION: ${APPFLOWY_S3_REGION:-us-east-1}
      APPFLOWY_MAILER_SMTP_HOST: ${APPFLOWY_MAILER_SMTP_HOST:-}
      APPFLOWY_MAILER_SMTP_PORT: ${APPFLOWY_MAILER_SMTP_PORT:-465}
      APPFLOWY_MAILER_SMTP_USERNAME: ${APPFLOWY_MAILER_SMTP_USERNAME:-}
      APPFLOWY_MAILER_SMTP_EMAIL: ${APPFLOWY_MAILER_SMTP_EMAIL:-}
      APPFLOWY_MAILER_SMTP_PASSWORD: ${APPFLOWY_MAILER_SMTP_PASSWORD:-}
      APPFLOWY_MAILER_SMTP_TLS_KIND: ${APPFLOWY_MAILER_SMTP_TLS_KIND:-wrapper}
    networks:
      - internal

  appflowy_search:
    image: appflowyinc/appflowy_search:${APPFLOWY_SEARCH_VERSION:-0.18.4}
    container_name: appflowy-search
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/$${APPFLOWY_SEARCH_PORT:-4002}
          printf 'GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          read -r _ status _ <&3
          [ "$$status" = 200 ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      APPFLOWY_SEARCH_HOST: ${APPFLOWY_SEARCH_HOST:-[::]}
      APPFLOWY_SEARCH_PORT: ${APPFLOWY_SEARCH_PORT:-4002}
      APPFLOWY_SEARCH_DATABASE_URL: ${APPFLOWY_DATABASE_URL}
      APPFLOWY_SEARCH_REDIS_URL: ${APPFLOWY_REDIS_URI}
      AI_OPENAI_API_KEY: ${AI_OPENAI_API_KEY:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-}
      APPFLOWY_S3_USE_MINIO: ${APPFLOWY_S3_USE_MINIO:-true}
      APPFLOWY_S3_MINIO_URL: ${APPFLOWY_S3_MINIO_URL}
      APPFLOWY_S3_ACCESS_KEY: ${APPFLOWY_S3_ACCESS_KEY}
      APPFLOWY_S3_SECRET_KEY: ${APPFLOWY_S3_SECRET_KEY}
      APPFLOWY_S3_BUCKET: ${APPFLOWY_S3_BUCKET:-appflowy}
      APPFLOWY_S3_REGION: ${APPFLOWY_S3_REGION:-us-east-1}
      APPFLOWY_BACKGROUND_INDEXER_ENABLED: true
      APPFLOWY_INDEXER_DATABASE_ENABLED: ${APPFLOWY_INDEXER_DATABASE_ENABLED:-false}
      APPFLOWY_KEYWORD_SEARCH_ENABLED: ${APPFLOWY_KEYWORD_SEARCH_ENABLED:-true}
      APPFLOWY_KEYWORD_WORKER_ENABLED: true
      APPFLOWY_KEYWORD_INDEX_MAP_SIZE_BYTES: ${APPFLOWY_KEYWORD_INDEX_MAP_SIZE_BYTES:-2147483648}
      APPFLOWY_KEYWORD_INDEX_DIR: ${APPFLOWY_KEYWORD_INDEX_DIR:-/var/lib/appflowy/keyword_index}
      APPFLOWY_GOTRUE_JWT_SECRET: ${GOTRUE_JWT_SECRET}
    volumes:
      - keyword_index_data:/var/lib/appflowy/keyword_index
    networks:
      - internal

  appflowy_web:
    image: appflowyinc/appflowy_web:${APPFLOWY_WEB_VERSION:-0.18.2}
    container_name: appflowy-web
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      appflowy_cloud:
        condition: service_healthy
    environment:
      APPFLOWY_BASE_URL: ${APPFLOWY_BASE_URL}
      APPFLOWY_GOTRUE_BASE_URL: ${APPFLOWY_BASE_URL}/gotrue
      APPFLOWY_WS_BASE_URL: ${APPFLOWY_WEBSOCKET_BASE_URL}
    networks:
      - internal

volumes:
  postgres_data:
  redis_data:
  minio_data:
  keyword_index_data:

networks:
  internal:
    name: appflowy-internal
    driver: bridge
