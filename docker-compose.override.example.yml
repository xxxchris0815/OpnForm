# Copy to docker-compose.override.yml after building local images:
#   cp docker-compose.override.example.yml docker-compose.override.yml
#
# Do not add an `ingress` service here. Ingress comes from docker-compose.yml
# and Traefik labels from docker-compose.traefik.yml.

services:
  api:
    image: opnform-api:local
  api-worker:
    image: opnform-api:local
  api-scheduler:
    image: opnform-api:local
  ui:
    image: opnform-ui:local
