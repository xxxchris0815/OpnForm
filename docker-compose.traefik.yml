# Traefik overlay. Always load docker-compose.yml first, then this file.
# Do not copy this file over docker-compose.yml or docker-compose.override.yml.
#
#   cp docker/traefik.env.example docker/traefik.env
#   ./scripts/docker-compose-traefik.sh config
#   ./scripts/docker-compose-traefik.sh up -d
#
# ingress always includes image: nginx:1. Never use !reset / !override here.

services:
  ingress:
    image: nginx:1
    container_name: opnform-ingress
    volumes:
      - ./docker/nginx.conf:/etc/nginx/templates/default.conf.template
    environment:
      - NGINX_MAX_BODY_SIZE=64m
    depends_on:
      api:
        condition: service_started
      ui:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && curl -f http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_DOCKER_NETWORK:-traefik}"
      - "traefik.http.routers.opnform.rule=Host(`${OPNFORM_DOMAIN:-forms.example.com}`)"
      - "traefik.http.routers.opnform.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.opnform.tls=true"
      - "traefik.http.routers.opnform.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.services.opnform.loadbalancer.server.port=80"
    networks:
      - default
      - traefik

networks:
  traefik:
    external: true
    name: ${TRAEFIK_DOCKER_NETWORK:-traefik}
