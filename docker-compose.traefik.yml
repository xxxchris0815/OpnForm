# Traefik overlay for the production Docker stack.
# Usage:
#   1. Replace forms.example.com, websecure, letsencrypt, and the traefik network name.
#   2. docker compose -f docker-compose.yml -f docker-compose.traefik.yml up -d
#
# See docs/deployment/docker-traefik.mdx for the full walkthrough.

services:
  ingress:
    ports: !reset []
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.opnform.rule=Host(`forms.example.com`)
      - traefik.http.routers.opnform.entrypoints=websecure
      - traefik.http.routers.opnform.tls=true
      - traefik.http.routers.opnform.tls.certresolver=letsencrypt
      - traefik.http.services.opnform.loadbalancer.server.port=80
    networks:
      - default
      - traefik

networks:
  traefik:
    external: true
    name: traefik
